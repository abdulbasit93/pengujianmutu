<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mangrove DKI Jakarta</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        #map {
            width: 100%;
            height: 950px;
        }
        .legend {
            background: white;
            padding: 10px;
            line-height: 18px;
            color: #555;
        }
        .style-selector {
            position: absolute;
            top: 10px;
            left: 100px;
            z-index: 1000;
            background: white;
            padding: 10px;
            border-radius: 5px;
        }

        @media (max-width: 768px) {
            #map {
                height: 400px;
            }
            .style-selector {
                top: 20px;
                left: 20px;
            }
        }
    </style>
</head>
<body>
    
    <div id="map"></div>

    <!-- Tombol untuk memilih style -->
    <div class="style-selector">
        <label for="styleSelect">Pilih Informasi Mangrove:</label>
        <select id="styleSelect">
            <option value="mangrove_kerapatan">Kerapatan Mangrove</option>
            <option value="mangrove_pencemaran">Pencemaran Mangrove</option>
            <option value="mangrove_stnak">Status Nilai Kesehatan Akhir</option>
        </select>
    </div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        // Menentukan bounding box untuk memusatkan peta
        var bbox = [[-6.129240799999934, 106.49209185600006], [-5.4213189259999695, 106.97045047850459]]; // Sesuaikan dengan bounding box Anda
        
        // Inisialisasi peta dengan layer OpenStreetMap sebagai background
        var map = L.map('map').fitBounds(bbox);

        // Tambahkan layer OpenStreetMap sebagai background
        var osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        }).addTo(map);

        // Inisialisasi lapisan WMS dengan style default
        var wmsLayer = L.tileLayer.wms('https://geoserver.piarea.co.id/geoserver/wms', {
            layers: 'mangrove:Mangrove-JKT-2024', // Ganti 'workspace:layername' dengan nama layer Anda
            format: 'image/png',
            transparent: true,
            styles: 'mangrove_kerapatan', // Style default
            attribution: "GeoServer WMS",
        }).addTo(map);

        // Set rentang zoom dari 0 sampai 21
        map.setMinZoom(0);
        map.setMaxZoom(21);

        // Fungsi untuk mendapatkan informasi atribut saat klik peta
        function onMapClick(e) {
            var url = getFeatureInfoUrl(
                map,
                wmsLayer,
                e.latlng,
                {
                    'info_format': 'application/json', // Gunakan format JSON agar mudah diproses
                    'propertyName': 'Lokasi,KTTJ,S_Pncmr,S_LBDS,S_VCR,S_TLI,S_Kmrataan,S_SQ,S_NAK,St_NAK' // Sesuaikan dengan atribut yang ingin ditampilkan
                }
            );
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.features.length > 0) {
                        var feature = data.features[0];
                        var props = feature.properties;
                        var popupContent = `
                            <b>Lokasi: </b>${props.Lokasi || 'N/A'}<br>
                            <b>Kerapatan: </b>${props.KTTJ || 'N/A'}<br>
                            <b>Skoring Pencemaran: </b>${props.S_Pncmr || 'N/A'}<br>
                            <b>Skoring Produktivitas: </b>${props.S_LBDS || 'N/A'}<br>
                            <b>Skoring Tajuk: </b>${props.S_VCR || 'N/A'}<br>
                            <b>Skoring Kerusakan: </b>${props.S_TLI || 'N/A'}<br>
                            <b>Skoring Indeks Kemerataan: </b>${props.S_Kmrataan || 'N/A'}<br>
                            <b>Skoring Kualitas Tapak: </b>${props.S_SQ || 'N/A'}<br>
                            <b>Nilai Akhir Kesehatan: </b>${props.S_NAK || 'N/A'}<br>
                            <b>Status Nilai Akhir Kesehatan: </b>${props.St_NAK || 'N/A'}`;
                        L.popup()
                            .setLatLng(e.latlng)
                            .setContent(popupContent)
                            .openOn(map);
                    } else {
                        L.popup()
                            .setLatLng(e.latlng)
                            .setContent("Tidak ada fitur di lokasi ini.")
                            .openOn(map);
                    }
                })
                .catch(error => {
                    console.error('Error fetching feature info:', error);
                    L.popup()
                        .setLatLng(e.latlng)
                        .setContent("Gagal memuat data. Silakan coba lagi.")
                        .openOn(map);
                });
        }

        // Menambahkan event listener untuk klik peta
        map.on('click', onMapClick);

        // Fungsi untuk mendapatkan URL FeatureInfo dari WMS
        function getFeatureInfoUrl(map, layer, latlng, params) {
            var point = map.latLngToContainerPoint(latlng, map.getZoom()),
                size = map.getSize(),
                bounds = map.getBounds(),
                southwest = bounds.getSouthWest(),
                northeast = bounds.getNorthEast();

            var defaultParams = {
                request: 'GetFeatureInfo',
                service: 'WMS',
                srs: 'EPSG:4326',
                styles: layer.wmsParams.styles,
                version: layer.options.version || '1.1.1',
                format: layer.options.format,
                bbox: [southwest.lng, southwest.lat, northeast.lng, northeast.lat].join(','),
                height: size.y,
                width: size.x,
                layers: layer.options.layers,
                query_layers: layer.options.layers,
                info_format: 'application/json' // Meminta hasil dalam format JSON
            };

            var params = L.Util.extend(defaultParams, params || {});
            return layer._url + L.Util.getParamString(params, layer._url, true) + '&X=' + point.x + '&Y=' + point.y;
        }

        // Menambahkan legenda ke dalam peta
        var legend = L.control({position: 'bottomleft'});

        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend');
            div.innerHTML += "<h4>LEGENDA</h4>"; //Judul Legenda
            div.innerHTML += '<img id="legendImage" src="https://geoserver.piarea.co.id/geoserver/wms?REQUEST=GetLegendGraphic&VERSION=1.0.0&FORMAT=image/png&LAYER=mangrove:Mangrove-JKT-2024&STYLE=mangrove_kerapatan" alt="legend">'; //Ambil aset Legenda dari geoserver
            return div;
        };

        legend.addTo(map);

        // Fungsi untuk mengubah style berdasarkan pilihan
        function changeStyle(style1) {
            // Hapus layer WMS sebelumnya
            map.removeLayer(wmsLayer);

            // Tambahkan lapisan WMS dengan style baru
            wmsLayer = L.tileLayer.wms('https://geoserver.piarea.co.id/geoserver/wms', {
                layers: 'mangrove:Mangrove-JKT-2024', // Ganti 'workspace:layername' dengan nama layer Anda
                format: 'image/png',
                transparent: true,
                styles: style1, // Ganti style sesuai pilihan
                attribution: "GeoServer WMS",
            }).addTo(map);

            // Update legenda berdasarkan style yang dipilih
            var legendUrl = `https://geoserver.piarea.co.id/geoserver/wms?REQUEST=GetLegendGraphic&VERSION=1.0.0&FORMAT=image/png&LAYER=mangrove:Mangrove-JKT-2024&STYLE=${style1}`;
            document.getElementById('legendImage').src = legendUrl;
        }

        // Event listener untuk dropdown style selector
        document.getElementById('styleSelect').addEventListener('change', function() {
            var selectedStyle = this.value;
            changeStyle(selectedStyle);
        });
    </script>
</body>
</html>
